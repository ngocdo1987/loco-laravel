<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | Goravel Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .post-card { min-height: 100%; }
    .content-html img { max-width: 100%; height: auto; border-radius: .5rem; }
    .editor-surface { min-height: 280px; border: 1px solid #ced4da; border-radius: .375rem; padding: .75rem; background: #fff; }
    .editor-toolbar { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .5rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Goravel Blog</a>
    <div class="d-flex gap-2 align-items-center">
      <a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
      {% if current_user %}
        <form method="post" action="/logout" class="m-0"><button class="btn btn-warning btn-sm" type="submit">Logout</button></form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="/login">Login</a><a class="btn btn-primary btn-sm" href="/register">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">
{% if flash %}<div class="alert alert-success">{{ flash }}</div>{% endif %}
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<div class="d-flex flex-wrap gap-2 mb-4"><a class="btn btn-outline-primary" href="/dashboard/posts">Posts</a><a class="btn btn-outline-primary" href="/dashboard/categories">Categories</a><a class="btn btn-outline-primary" href="/dashboard/tags">Tags</a><a class="btn btn-outline-primary" href="/dashboard/comments">Comments</a><a class="btn btn-primary" href="/dashboard/posts/new">New post</a></div>
<h1>{{ title }}</h1><form method="post" action="{{ action }}" class="row g-2 mb-4"><div class="col-md-8"><input class="form-control" name="name" placeholder="Name" required maxlength="100"></div><div class="col-md-2"><button class="btn btn-primary w-100">Create</button></div></form>
<table class="table table-striped bg-white"><thead><tr><th>Name</th><th>Slug</th><th></th></tr></thead><tbody>{% for item in items %}<tr><td><form method="post" action="{{ action }}/{{ item.id }}" class="d-flex gap-2"><input class="form-control" name="name" value="{{ item.name }}" required></td><td>{{ item.slug }}</td><td class="text-end"><button class="btn btn-sm btn-outline-primary">Save</button></form><form class="d-inline" method="post" action="{{ action }}/{{ item.id }}/delete"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="3">No items.</td></tr>{% endfor %}</tbody></table>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
